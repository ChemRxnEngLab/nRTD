[project]
name = "nrtd"
version = "0.1.0"
description = "RTD kernels fitted as a chain of 1-D convolutions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "hcrnns",
    "iciw-plots>=1.2.0",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pytorch-lightning>=2.6.6",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "torch>=2.15.0",
    "wandb>=0.31.0",
]

[tool.uv]
package = false

[tool.uv.sources]
hcrnns = { path = "../hcrnns", editable = true }

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
